name: interview-demo-ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repository structure
        run: find . -maxdepth 3 -type f | sort
      - name: Python syntax check
        run: python -m compileall notebooks
